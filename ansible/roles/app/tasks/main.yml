# tasks file for roles/network
---

- name: Launch application container
  community.docker.docker_container:
    name: simple-api
    image: darfilalabdou/tp-devops-simple-api
    state: started
    restart_policy: unless-stopped
    networks:
      - name: app-network
        aliases:
          - backend

